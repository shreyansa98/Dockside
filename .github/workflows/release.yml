name: Release DMG

# Run from the Actions tab to build a DMG and attach it to a draft pre-release for review.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, e.g. v0.2.0-beta
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build DMG
        run: ./build.sh --dmg --no-install
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" build/*.dmg build/*.dmg.sha256 \
            --draft --prerelease --target "${{ github.sha }}" \
            --title "Dockside ${{ inputs.tag }}" --notes-file CHANGELOG.md
