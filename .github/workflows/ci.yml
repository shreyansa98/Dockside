name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build arm64
        run: swift build -c release --arch arm64
      - name: Build x86_64
        run: swift build -c release --arch x86_64
