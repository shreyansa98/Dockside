name: 🐞 Bug report
description: Something isn't working the way it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this! Clear steps help us fix it fast.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add the … widget
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: widget
    attributes:
      label: Which widget or feature?
      placeholder: e.g. Now Playing, Claude panel, auto-hide
  - type: input
    id: version
    attributes:
      label: Dockside version
      description: Menu bar icon ▸ Settings ▸ About
      placeholder: 0.1.0 beta
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.6, MacBook Air M2
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or screen recording
      description: Drag files here. Please blur anything personal.
